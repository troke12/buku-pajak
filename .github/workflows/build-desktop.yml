name: build-desktop

# Build installer desktop (Tauri) untuk Windows/macOS/Linux dan bikin
# GitHub Release otomatis lewat tag versi (v*). PyInstaller tidak bisa
# cross-compile, jadi tiap platform harus benar-benar dibangun di runner
# platform itu sendiri — makanya pakai matrix, bukan satu job.
#
# Sengaja TIDAK jalan tiap push/PR: compile Rust + matrix 3 platform berat
# dan lama, jadi cuma dipicu tag rilis. workflow_dispatch tersedia buat
# nge-tes workflow ini secara manual tanpa perlu bikin tag rilis beneran —
# hasilnya tetap jadi GitHub Release, tapi berstatus draft (releaseDraft:
# true) supaya aman diulang-ulang tanpa mengotori halaman Releases publik;
# tinggal dipublish manual dari GitHub kalau sudah yakin, atau ganti
# releaseDraft ke false begitu alurnya terpercaya.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: dtolnay/rust-toolchain@stable

      - name: Pasang dependensi sistem (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Pasang dependensi Python (aplikasi + build)
        run: python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Bangun sidecar backend
        shell: bash
        run: ./scripts/build-sidecar.sh

      - name: Build & rilis aplikasi desktop
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('manual-{0}', github.run_number) }}
          releaseName: "Buku Pajak __VERSION__"
          releaseBody: "Lihat aset di bawah untuk unduh installer sesuai OS."
          releaseDraft: true
          prerelease: false
